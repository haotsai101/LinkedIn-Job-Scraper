[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-job-scraper"
version = "0.1.0"
description = "LinkedIn Job Scraper with Dagster integration"
authors = [{name = "LinkedIn Job Scraper Contributors"}]
requires-python = ">=3.11"
# This list is the single source of truth for runtime dependencies.
# requirements.txt only points back here (`-e .[dev]`).
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.1",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.2",
    "wordcloud>=1.8.2",
    "dagster>=1.12.18",
    "dagster-webserver>=1.12.18",
    "playwright>=1.44.0",  # apply agent browser + scraper LinkedIn login (T17 PR2). First run needs `playwright install chromium`.
    "httpx>=0.27.0",
    "openai>=1.0.0",  # legacy OpenAI-backed `apply_jobs.py --setup` profile interview only (T54 removed the NIM classifier + browser-use paths that used to be the other reason)
    "tenacity>=8,<10",  # retry/backoff around the Voyager API calls in scripts/fetch.py (T17)
    "claude-agent-sdk>=0.2.140,<0.3",  # Easy Apply classifier + browser agent (subscription auth, no API key) — T14/T14b. Pinned <0.3: relies on ClaudeAgentOptions.output_format + one-shot query() session isolation.
    "mcp>=2.1,<3",  # offsite guard-mcp (OA4): client to Playwright MCP + streamable-HTTP server for the model SDKs. v2 API (Client, lowlevel Server(on_*=...)).
    "uvicorn>=0.30",  # serves guard-mcp's streamable-HTTP app in-process (OA4)
    "openai-agents==0.22.3",  # offsite NIM runner (OA8): Agent + OpenAIChatCompletionsModel + MCPServerStreamableHttp. Pinned: pre-1.0, API moves fast.
]

# `ruff` is pinned to a single minor so `ruff check` findings stay stable across
# machines/CI — bump deliberately (a new ruff minor can add/retire rules).
# `pytest` only needs a floor (the suite uses raises/warns/parametrize/fixture/
# MonkeyPatch, stable since pytest 6) with a `<10` major ceiling.
# `scripts/lint.sh` / `scripts/check.sh` install these into a project-local .venv/.
[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.16.6,<0.17"]

[tool.dagster]
module_name = "scripts.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Flat layout with several top-level modules alongside the `scripts` package —
# setuptools auto-discovery can't handle that, so state it explicitly.
[tool.setuptools]
packages = ["scripts", "offsite"]
package-data = { offsite = ["*.js"] }
py-modules = [
    "config",
    "common",
    "llm",
    "apply_jobs",
    "linkedin_apply",
    "search_retriever",
    "details_retriever",
    "to_csv",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
